<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artivora - AI Image Prompt Generator</title>
  <meta name="description" content="Create stunning AI image prompts in seconds with Artivora. Generate cinematic, realistic and creative prompts for AI image generators.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #ffffff;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #6d28d9;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 14px;
    }

    .hero p {
      color: #6b7280;
      font-size: 17px;
      max-width: 650px;
      margin: auto;
    }

    .container {
      max-width: 850px;
      margin: 25px auto 60px;
      padding: 0 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    label {
      display: block;
      font-weight: 700;
      margin: 17px 0 8px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #6d28d9;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #6d28d9;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 25px;
      display: none;
    }

    .result h2 {
      margin-bottom: 10px;
    }

    #promptOutput {
      background: #f3f4f6;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.6;
      min-height: 120px;
    }

    .copy-btn {
      background: #111827;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 31px;
      }

      .box {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Art<span>ivora</span></div>
  <div>AI Tools</div>
</header>

<section class="hero">
  <h1>AI Image Prompt Generator</h1>
  <p>
    Create detailed, cinematic and creative AI image prompts in seconds.
    Perfect for creators, designers and AI artists.
  </p>
</section>

<div class="container">

  <div class="box">

    <label>What do you want to create?</label>
    <input id="subject" type="text"
      placeholder="Example: A giant dragon in a village">

    <label>Image Style</label>
    <select id="style">
      <option>Realistic</option>
      <option>Cinematic</option>
      <option>3D</option>
      <option>Anime</option>
      <option>Fantasy</option>
      <option>Photorealistic</option>
    </select>

    <label>Background</label>
    <select id="background">
      <option>Lush green landscape</option>
      <option>Modern city</option>
      <option>Mysterious forest</option>
      <option>Futuristic environment</option>
      <option>Mountain landscape</option>
      <option>Studio background</option>
    </select>

    <label>Lighting</label>
    <select id="lighting">
      <option>Cinematic lighting</option>
      <option>Golden hour lighting</option>
      <option>Dramatic lighting</option>
      <option>Neon lighting</option>
      <option>Soft natural lighting</option>
    </select>

    <label>Aspect Ratio</label>
    <select id="ratio">
      <option>16:9</option>
      <option>9:16</option>
      <option>4:5</option>
      <option>1:1</option>
    </select>

    <button onclick="generatePrompt()">
      ✨ Generate Prompt
    </button>

    <div class="result" id="result">
      <h2>Your AI Prompt</h2>

      <div id="promptOutput"></div>

      <button class="copy-btn" onclick="copyPrompt()">
        📋 Copy Prompt
      </button>
    </div>

  </div>

</div>

<footer>
  © 2026 Artivora — AI Image Prompt Generator
</footer>

<script>

function generatePrompt() {

  const subject = document.getElementById("subject").value.trim();
  const style = document.getElementById("style").value;
  const background = document.getElementById("background").value;
  const lighting = document.getElementById("lighting").value;
  const ratio = document.getElementById("ratio").value;

  if (!subject) {
    alert("Please enter what you want to create.");
    return;
  }

  const prompt =
    `${subject}, ${style} style, highly detailed, ultra realistic details, ` +
    `${background}, ${lighting}, professional composition, dramatic depth, ` +
    `sharp focus, realistic textures, atmospheric details, high quality, ` +
    `cinematic photography, visually stunning, ${ratio} aspect ratio`;

  document.getElementById("promptOutput").innerText = prompt;
  document.getElementById("result").style.display = "block";
}

function copyPrompt() {

  const prompt = document.getElementById("promptOutput").innerText;

  navigator.clipboard.writeText(prompt).then(function() {
    alert("Prompt copied!");
  });

}

</script>

</body>
</html>
